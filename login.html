<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - AI Resume Analyzer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            max-width: calc(100% - 60px);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .register-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .register-link a {
            color: #007bff;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Login</h2>

        <form id="login-form">

            <input
                type="email"
                id="email"
                placeholder="Email"
                autocomplete="email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">
                Login
            </button>

        </form>

        <!-- Success or error message appears here -->
        <div id="message" role="status" aria-live="polite"></div>

        <div class="register-link">
            Don't have an account?
            <a href="register.html">Register</a>
        </div>

    </div>

    <script>
        document
            .getElementById("login-form")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const email = document
                    .getElementById("email")
                    .value.trim();

                const password = document
                    .getElementById("password")
                    .value;

                const message = document
                    .getElementById("message");

                const loginButton = document
                    .getElementById("loginButton");

                // Disable the button while processing
                loginButton.disabled = true;
                loginButton.innerText = "Logging in...";

                message.innerText = "";
                message.className = "";

                try {

                    // Send login details to Flask backend
                    const response = await fetch(
                        "http://127.0.0.1:5000/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        }
                    );

                    const data = await response.json();

                    // Check whether login was successful
                    if (response.ok && data.status === "success") {

                        const user = data.user;

                        // Save user information
                        localStorage.setItem(
                            "resumeAnalyzerLoggedIn",
                            "true"
                        );

                        localStorage.setItem(
                            "user_id",
                            user.user_id
                        );

                        localStorage.setItem(
                            "user_name",
                            user.name
                        );

                        localStorage.setItem(
                            "user_email",
                            user.email
                        );

                        // Display success message
                        message.className = "success";
                        message.innerText = "Login Successfully!";

                        // Redirect after 2 seconds
                        setTimeout(function() {
                            window.location.href = "home.html";
                        }, 2000);

                    } else {

                        // Display error message
                        message.className = "error";
                        message.innerText =
                            data.message || "Login failed. Please check your details.";

                        // Re-enable button after failed login
                        loginButton.disabled = false;
                        loginButton.innerText = "Login";
                    }

                } catch (error) {

                    console.error("Login error:", error);

                    message.className = "error";
                    message.innerText =
                        "Cannot connect to backend. Make sure Flask server is running.";

                    loginButton.disabled = false;
                    loginButton.innerText = "Login";
                }

            });
    </script>

</body>

</html>
